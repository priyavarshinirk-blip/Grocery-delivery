$kind: http-request
url: "{{baseUrl}}/auth/me"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "name": "Updated Customer",
      "email": "updated-customer@grocery.test",
      "phone": "9876543210",
      "defaultAddress": {
        "line1": "12 MG Road",
        "area": "Koramangala",
        "pincode": "560034"
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
