$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "status": "PICKING"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 8000
