$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{deliveryToken}}
body:
  type: text
  content: |-
    {
      "status": "FAILED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 15000
