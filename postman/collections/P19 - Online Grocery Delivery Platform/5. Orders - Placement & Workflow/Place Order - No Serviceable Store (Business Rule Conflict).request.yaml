$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "items": [ { "productId": "{{productId}}", "quantity": 1 } ],
      "deliveryAddress": { "line1": "Nowhere", "area": "Nowhere", "pincode": "999999" }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('errorCode is NO_SERVICEABLE_STORE', () => pm.expect(pm.response.json().errorCode).to.eql('NO_SERVICEABLE_STORE'));
    language: text/javascript
order: 2000
