$kind: http-request
name: Update Status - Invalid Transition (PLACED -> DELIVERED)
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: text
  content: |-
    {
      "status": "DELIVERED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('errorCode is INVALID_TRANSITION', () => pm.expect(pm.response.json().errorCode).to.eql('INVALID_TRANSITION'));
    language: text/javascript
order: 7000
