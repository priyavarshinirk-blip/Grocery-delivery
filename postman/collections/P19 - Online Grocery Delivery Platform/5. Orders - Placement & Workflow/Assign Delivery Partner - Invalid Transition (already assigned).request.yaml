$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/assign"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 12000
