$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/assign"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{staffToken}}
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Order status is ASSIGNED', () => pm.expect(pm.response.json().data.status).to.eql('ASSIGNED'));
    language: text/javascript
order: 11000
