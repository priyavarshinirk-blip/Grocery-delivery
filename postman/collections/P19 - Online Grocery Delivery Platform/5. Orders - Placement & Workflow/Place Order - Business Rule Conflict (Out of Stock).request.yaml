$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: text
  content: |-
    {
      "items": [ { "productId": "{{productId}}", "quantity": 999 } ],
      "deliveryAddress": { "line1": "HSR Layout", "area": "HSR", "pincode": "560102" }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 409', () => pm.response.to.have.status(409));
      pm.test('errorCode is INSUFFICIENT_STOCK', () => pm.expect(pm.response.json().errorCode).to.eql('INSUFFICIENT_STOCK'));
    language: text/javascript
order: 1000
