$kind: http-request
url: "{{baseUrl}}/store-stock/low-stock?storeId={{storeId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  storeId: "{{storeId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Contains the just-created low-stock product', () => pm.expect(pm.response.json().data.count).to.be.above(0));
    language: text/javascript
order: 2000
