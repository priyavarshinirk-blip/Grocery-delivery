$kind: http-request
url: "{{baseUrl}}/dark-stores"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: text
  content: |-
    {
      "name": "HSR Layout Dark Store",
      "area": "HSR Layout, Bengaluru",
      "location": { "coordinates": [77.6387, 12.9121] },
      "serviceablePincodes": ["560102"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('storeId', pm.response.json().data.store._id);
    language: text/javascript
order: 1000
