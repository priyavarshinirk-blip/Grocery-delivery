$kind: http-request
name: List Available Partners (Admin/Staff)
url: "{{baseUrl}}/delivery-partners?isAvailable=true"
method: GET
headers:
  Authorization: Bearer {{staffToken}}
queryParams:
  isAvailable: "true"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
